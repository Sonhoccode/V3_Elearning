# fly.toml app configuration file generated for v3-elearning-y3nliw on 2026-05-03T23:57:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'v3-elearning-y3nliw'
primary_region = 'sin'

[build]
  dockerfile = '../../Dockerfile'

[deploy]
  release_command = 'python manage.py migrate --skip-checks --noinput'

  [deploy.release_command_vm]
    size = 'shared-cpu-1x'
    memory = '1gb'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
